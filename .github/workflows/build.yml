name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out -A x64
      - name: Build
        run: cmake --build out --config Release --parallel
      - name: Test
        run: ctest --test-dir out -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Executable out/Release/Paperdesk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Paperdesk-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

